vram_texture_compression/for_mobile=false
html/export_icon=true
html/head_include="<script>/* Rush: unlock sound on the first tap (Safari/Chrome start audio suspended). Every AudioContext the engine makes is resumed inside a real user gesture. */(function(){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var L=[];var W=function(o){var c=new A(o);L.push(c);return c;};W.prototype=A.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;var R=function(){L.forEach(function(c){if(c.state!=='running'){c.resume();try{var s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0);}catch(e){}}});};['touchend','pointerup','click','keydown'].forEach(function(e){window.addEventListener(e,R,true);});})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
